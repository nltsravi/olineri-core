name: olineri_flutter
description: Offline Indian-Language Pronunciation Assessment SDK for Flutter
version: 0.1.0
homepage: https://github.com/nltsravi/olineri-core

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.olineri.flutter
        pluginClass: OlineriFlutterPlugin
      ios:
        pluginClass: OlineriFlutterPlugin
